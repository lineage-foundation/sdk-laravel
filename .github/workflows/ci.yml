name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sdk-laravel
        uses: actions/checkout@v4

      # sdk-laravel's composer.json resolves lineage/php via a "path"
      # repository (../sdk-php) rather than Packagist, because sdk-php's own
      # /v1 migration hasn't been published yet. Checking out the matching
      # sibling branch here into ../sdk-php (relative to $GITHUB_WORKSPACE,
      # same as the local dev layout) lets `composer install` resolve it
      # exactly as it does on a workstation. Once lineage/php ships a tagged
      # /v1 release to Packagist, drop this step, remove the `repositories`
      # entry from composer.json, and let `require.lineage/php` resolve
      # normally.
      - name: Checkout sdk-php (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: lineage-foundation/sdk-php
          ref: feat/v1-migration
          path: ../sdk-php

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit
